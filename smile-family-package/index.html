<!doctype html>
<html lang="pt">
  <head>

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>Smile Family | Clínica Dentária em Maputo</title>

    <meta property="og:locale" content="pt_MZ" />
    <meta property="og:site_name" content="Smile Family" />
    <meta
      property="og:title"
      content="Smile Family | Clínica Dentária em Maputo"
    />

      property="og:description"

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Smile Family | Clínica Dentária em Maputo"
    />

      name="twitter:description"
      content="Cuidados odontológicos de qualidade para toda a família em Maputo. Marque a sua consulta na Smile Family."

      name="twitter:image"
      content="https://smilefamily.co.mz/images/og-image.jpg"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap"

    <!-- Structured data: Dentist / LocalBusiness / MedicalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "Smile Family, LDA",
        "description": "Clínica dentária em Maputo com atendimento odontológico humanizado para toda a família.",
        "image": "https://smilefamily.co.mz/images/og-image.jpg",
        "url": "https://smilefamily.co.mz/",
        "telephone": "+258858609313",
        "email": "info@smilefamily.co.mz",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Marien Ngouabi, n.º 330, rés-do-chão, Bairro da Malhangalene",
          "addressLocality": "Maputo",
          "addressCountry": "MZ"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "17:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "08:00",
            "closes": "13:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
